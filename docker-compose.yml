services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: wonder_store
      POSTGRES_USER: wonder_user
      POSTGRES_PASSWORD: wonder_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: ./api
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./api:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgres://wonder_user:wonder_password@db:5432/wonder_store
      - SECRET_KEY=django-insecure-test-key
      - DEBUG=True
      - ALLOWED_HOSTS=*
      - CORS_ALLOWED_ORIGINS=http://localhost:3000
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
    command: npm run dev -- --host
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:5173"
    environment:
      - VITE_API_URL=http://localhost:8000

volumes:
  postgres_data:
